<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Projeto de Pedro Augusto." />
    <title>Projeto | Pedro Augusto</title>
    <link rel="stylesheet" href="./portfolio.css?v=project-galleries" />
  </head>
  <body class="project-page">
    <header class="site-header">
      <a class="monogram" href="./index.html#inicio" aria-label="Pedro Augusto, inicio">PA</a>
      <nav aria-label="Navegacao principal">
        <a href="./index.html#trabalhos">Trabalhos</a>
        <a href="./index.html#sobre">Sobre</a>
        <a href="./index.html#inicio">Inicio</a>
      </nav>
    </header>

    <main class="project-detail" id="inicio">
      <div class="content-frame">
        <a class="project-back" href="./index.html#trabalhos"><span aria-hidden="true">&larr;</span> Trabalhos</a>
      </div>

      <section class="content-frame project-detail-hero" aria-labelledby="project-title">
        <div class="project-detail-copy">
          <p class="eyebrow" id="project-type"></p>
          <h1 id="project-title"></h1>
          <p class="project-intro" id="project-intro"></p>
        </div>
        <div class="case-window">
          <img id="project-image" src="" alt="" />
        </div>
      </section>

      <section class="content-frame project-facts" aria-label="Detalhes do projeto">
        <div>
          <p>Formato</p>
          <strong id="project-format"></strong>
        </div>
        <div>
          <p>Foco</p>
          <strong id="project-focus"></strong>
        </div>
      </section>

      <section class="content-frame project-gallery" aria-labelledby="gallery-title">
        <p class="eyebrow" id="gallery-title">Galeria</p>
        <div class="case-gallery" id="project-gallery"></div>
      </section>

      <section class="content-frame project-study-notes" id="project-study-notes" aria-labelledby="study-notes-title" hidden>
        <p class="eyebrow" id="study-notes-title">Estudos</p>
        <ul id="project-notes"></ul>
      </section>

      <section class="next-project">
        <div class="content-frame">
          <p class="eyebrow">Proximo</p>
          <a id="next-project" href="./index.html#trabalhos">
            <span id="next-project-title"></span>
            <span aria-hidden="true">&nearr;</span>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <p>Pedro Augusto</p>
      <a href="./index.html#inicio">Voltar ao inicio <span aria-hidden="true">&uarr;</span></a>
    </footer>

    <script>
      const projects = {
        "conteudo-html": {
          title: "Conteúdo HTML | Design Estático",
          type: "Design estático",
          image: "./public/projects/html-design-estatico.png",
          intro: "Pecas digitais e estudos visuais reunidos no projeto original.",
          format: "Peca digital",
          focus: "Direcao de arte",
          gallery: [
            "./public/projects/cases/conteudo-html/01.webp",
            "./public/projects/cases/conteudo-html/02.webp",
            "./public/projects/cases/conteudo-html/03.webp"
          ]
        },
        "motion-design": {
          title: "Motion Design",
          type: "Animacao",
          image: "./public/projects/motion-design.png",
          intro: "Selecao de estudos de animacao e headers produzidos para diferentes marcas.",
          format: "Estudos de animacao",
          focus: "Motion e campanhas",
          gallery: ["./public/projects/motion-design.png"],
          notes: [
            "Estudo para marca Diploko",
            "Estudo Cestinha (eFacil)",
            "Headers para Mattel, Barbie, Precon, Dove, Megatron, BIC, Dreamies, Deli e Apti"
          ]
        },
        "diagramacao": {
          title: "Diagramação",
          type: "Editorial",
          image: "./public/projects/diagramacao.jpg",
          intro: "Paginas editoriais, estudos de grid e composicoes tipograficas do projeto original.",
          format: "Pagina editorial",
          focus: "Tipografia e grid",
          gallery: [
            "./public/projects/cases/diagramacao/01.webp",
            "./public/projects/cases/diagramacao/02.webp",
            "./public/projects/cases/diagramacao/03.webp",
            "./public/projects/cases/diagramacao/04.webp",
            "./public/projects/cases/diagramacao/05.webp"
          ]
        },
        "ambiente-3d": {
          title: "Ambiente 3D",
          type: "3D",
          image: "./public/projects/ambiente-3d.png",
          intro: "Estudos de cena, materialidade e atmosfera tridimensional trazidos da galeria original.",
          format: "Cena 3D",
          focus: "Ambiente e luz",
          gallery: [
            "./public/projects/cases/ambiente-3d/01.webp",
            "./public/projects/cases/ambiente-3d/02.webp",
            "./public/projects/cases/ambiente-3d/03.webp",
            "./public/projects/cases/ambiente-3d/04.webp",
            "./public/projects/cases/ambiente-3d/05.webp",
            "./public/projects/cases/ambiente-3d/06.webp"
          ]
        },
        "efacil": {
          title: "eFácil",
          type: "Produto digital",
          image: "./public/projects/efacil.png",
          intro: "Pecas de comunicacao e interface desenvolvidas para o universo eFacil.",
          format: "Interface digital",
          focus: "Campanhas e varejo",
          gallery: [
            "./public/projects/cases/efacil/01.webp",
            "./public/projects/cases/efacil/02.webp",
            "./public/projects/cases/efacil/03.webp",
            "./public/projects/cases/efacil/04.webp",
            "./public/projects/cases/efacil/05.webp"
          ]
        },
        "quem-sou-eu": {
          title: "Quem Sou Eu?",
          type: "Pessoal",
          image: "./public/projects/quem-sou-eu.png",
          intro: "Projeto autoral com a peca original em destaque.",
          format: "Projeto pessoal",
          focus: "Ilustracao digital",
          gallery: ["./public/projects/cases/quem-sou-eu/01.webp"]
        }
      };

      const projectIds = Object.keys(projects);
      const requestedId = new URLSearchParams(window.location.search).get("projeto");
      const activeId = projects[requestedId] ? requestedId : projectIds[0];
      const project = projects[activeId];
      const nextId = projectIds[(projectIds.indexOf(activeId) + 1) % projectIds.length];
      const next = projects[nextId];

      document.title = `${project.title} | Pedro Augusto`;
      document.querySelector("#project-type").textContent = project.type;
      document.querySelector("#project-title").textContent = project.title;
      document.querySelector("#project-intro").textContent = project.intro;
      document.querySelector("#project-format").textContent = project.format;
      document.querySelector("#project-focus").textContent = project.focus;
      document.querySelector("#project-image").src = project.image;
      document.querySelector("#project-image").alt = project.title;
      document.querySelector("#next-project").href = `./projeto.html?projeto=${nextId}`;
      document.querySelector("#next-project-title").textContent = next.title;

      const gallery = document.querySelector("#project-gallery");
      project.gallery.forEach((source, index) => {
        const figure = document.createElement("figure");
        const image = document.createElement("img");
        image.src = source;
        image.alt = `${project.title} - imagem ${index + 1}`;
        image.loading = "lazy";
        figure.append(image);
        gallery.append(figure);
      });

      if (project.notes) {
        const notesSection = document.querySelector("#project-study-notes");
        const notes = document.querySelector("#project-notes");
        project.notes.forEach((note) => {
          const item = document.createElement("li");
          item.textContent = note;
          notes.append(item);
        });
        notesSection.hidden = false;
      }
    </script>
  </body>
</html>
