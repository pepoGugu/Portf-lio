    const ext = file => file.split('.').pop().toLowerCase();
    const isVideo = file => ['mp4','mov','mkv','webm'].includes(ext(file));
    const url = file => encodeURI(base + file);
    const escapeHtml = value => value.replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    const card = item => { const video = isVideo(item.file), safeTitle = escapeHtml(item.title), source = url(item.file), poster = item.poster ? ` poster="${url(item.poster)}"` : ''; return `<article class="media-card"><button class="media-preview" type="button" data-file="${source}" data-title="${safeTitle}" data-kind="${video ? 'Vídeo do projeto' : 'Imagem do projeto'}">${video ? `<video muted playsinline preload="metadata"${poster} src="${source}"></video>` : `<img src="${source}" alt="${safeTitle}" loading="lazy">`}<span class="type ${video ? 'video' : ''}">${video ? 'Vídeo' : ext(item.file)}</span></button><div class="media-card-info"><strong title="${safeTitle}">${safeTitle}</strong>${item.link ? `<a href="${item.link}" target="_blank" rel="noreferrer">Ver página de exemplo ↗</a>` : ''}</div></article>`; };
    const productFolder = folder => `<details class="product-folder" open><summary><span class="product-folder-title"><strong>${escapeHtml(folder.title)}</strong><span>Código ${escapeHtml(folder.code)}</span></span><span class="product-folder-meta"><a href="${folder.link}" target="_blank" rel="noreferrer">Ver página do produto ↗</a></span></summary><div class="folder-media"><div class="gallery">${folder.items.map(card).join('')}</div></div></details>`;
    const groupMarkup = group => { const content = group.items ? `<div class="gallery">${group.items.map(card).join('')}</div>` : `<div class="product-folders">${group.folders.map(productFolder).join('')}</div>`; return `<div class="group"><div class="group-header"><h3>${group.title}</h3></div>${group.description ? `<p class="group-copy">${group.description}</p>` : ''}${content}</div>`; };
    document.querySelector('#catalog').innerHTML = catalogs.map(section => { const layoutLab = section.id === 'layout-lab'; return `<section class="gallery-section anchor ${layoutLab ? 'layout-lab-section' : ''}" id="${section.id}"><div class="shell"><div class="section-top"><div><p class="eyebrow">${section.eyebrow}</p><h2>${section.title}</h2>${section.reference ? `<div class="resources"><a class="resource" href="${section.reference.href}" target="_blank" rel="noreferrer">↗ ${section.reference.label}</a></div>` : ''}</div>${layoutLab ? '' : `<div><p>${section.description}</p></div>`}</div>${section.groups.map(groupMarkup).join('')}${layoutLab ? `<p class="section-summary">${section.description}</p>` : ''}</div></section>`; }).join('');
    const header = document.querySelector('header'); window.addEventListener('scroll', () => header.classList.toggle('is-scrolled', window.scrollY > 12), {passive:true});
    const viewer = document.querySelector('#viewer'), media = document.querySelector('#viewer-media'), title = document.querySelector('#viewer-title'), type = document.querySelector('#viewer-type');
    document.addEventListener('click', event => { const trigger = event.target.closest('.media-preview'); if (!trigger) return; const source = trigger.dataset.file, video = trigger.dataset.kind.startsWith('Vídeo'); media.innerHTML = video ? `<video controls autoplay playsinline src="${source}"></video>` : `<img src="${source}" alt="${trigger.dataset.title}">`; title.textContent = trigger.dataset.title; type.textContent = trigger.dataset.kind; viewer.showModal(); });
    document.querySelector('#viewer-close').addEventListener('click', () => viewer.close()); viewer.addEventListener('close', () => { media.innerHTML = ''; }); viewer.addEventListener('click', event => { if (event.target === viewer) viewer.close(); });
